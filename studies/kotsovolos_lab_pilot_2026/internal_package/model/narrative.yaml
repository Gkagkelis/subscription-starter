# Κείμενα της παρουσίασης πελάτη. Οι αριθμοί ΔΕΝ γράφονται με το χέρι: τα {ονόματα} συμπληρώνονται από την ανάλυση
# (internal_package/report_facts.json). Τα ευρήματα σεναρίου (S) διατυπώνονται ως εκτιμήσεις σεναρίου, όχι ως μετρήσεις.
file_base: viewscope_kotsovolos_2026_client_report
short_title: "Κωτσόβολος — Εικόνα, εμπιστοσύνη & εμπειρία πελάτη 2026"
cover_title: "Κωτσόβολος: εικόνα, εμπιστοσύνη και εμπειρία πελάτη"
cover_sub: "Συνθετική έρευνα σε {n} ενήλικες στην Ελλάδα — αναγνωρισιμότητα, εμπιστοσύνη, εμπειρία αγοράς και after-sales, σύσταση, κοινωνική προσφορά και ανάκτηση εμπιστοσύνης."
cover_meta: "Viewscope · Νοέμβριος 2026 · Πιλοτική έκδοση"

identity:
  Αντικείμενο: "Εικόνα και εμπιστοσύνη προς την αλυσίδα Κωτσόβολος, εμπειρία αγοράς, παραδόσεις και after-sales, σύσταση, κοινωνική προσφορά"
  Πληθυσμός: "Ενήλικες 18+ σε όλη την Ελλάδα (13 περιφέρειες)"
  Δείγμα: "{n} συνθετικοί ερωτώμενοι · {n_aware} γνωρίζουν την αλυσίδα · {n_cust} πελάτες των τελευταίων 24 μηνών"
  Ερωτηματολόγιο: "37 ερωτήσεις (εγκεκριμένο ερωτηματολόγιο της μελέτης, χωρίς αλλαγές), με λογική διαδρομών"
  Μέθοδος: "Συνθετική έρευνα Viewscope Synthetic Lab: βαθμονομημένος πληθυσμός ΕΛΣΤΑΤ/Eurostat, εμπειρικοί δείκτες Eurostat και ρητό σενάριο για τις ερωτήσεις μάρκας"
  Ημερομηνία: "Νοέμβριος 2026"
identity_insight: "Πιλοτική συνθετική έρευνα: δείχνει τι προκύπτει από τα διαθέσιμα δημόσια δεδομένα και από ένα ρητό, ελέγξιμο σενάριο για τη μάρκα. Τα αποτελέσματα για τη μάρκα είναι εκτιμήσεις σεναρίου και πρέπει να επιβεβαιωθούν με έρευνα πεδίου."

exec_title: "Ισχυρή αναγνωρισιμότητα, μέτρια εμπιστοσύνη — η εμπειρία κάνει τη διαφορά"
exec_insight: "Η αλυσίδα είναι οικεία σχεδόν σε όλους, αλλά η εμπιστοσύνη και η σύσταση μένουν σε μέτρια επίπεδα. Στο σενάριο, ό,τι ξεχωρίζει όσους εμπιστεύονται είναι η προσωπική εμπειρία."
key_findings:
  - "<b>Αναγνωρισιμότητα:</b> {know} γνωρίζουν την αλυσίδα αρκετά ή πολύ καλά· {cust} του πληθυσμού έχουν αγοράσει από αυτήν τα τελευταία δύο χρόνια."
  - "<b>Εμπιστοσύνη:</b> {trust} την εμπιστεύονται πολύ ή πάρα πολύ και {image} έχουν θετική εικόνα — ένα σημαντικό μέρος κρατά ουδέτερη στάση."
  - "<b>Η εμπειρία κάνει τη διαφορά:</b> η εμπιστοσύνη φτάνει {trust_cust} στους πελάτες έναντι {trust_noncust} στους μη πελάτες, και {trust_exp_pos} σε όσους είχαν θετική εμπειρία."
  - "<b>Σύσταση:</b> ο NPS είναι {nps} συνολικά — θετικός στους πελάτες ({nps_cust}), αρνητικός σε όσους δεν έχουν αγοράσει ({nps_noncust})."
  - "<b>After-sales:</b> {problem} των πελατών αναφέρουν κάποιο πρόβλημα στην πιο πρόσφατη αγορά· η επίλυση είναι το σημείο που κρίνει αν η εμπιστοσύνη θα πέσει ή θα ανακάμψει."
  - "<b>Κοινωνική προσφορά:</b> μόνο {csr_offset} θεωρούν ότι η κοινωνική προσφορά αντισταθμίζει κακή εξυπηρέτηση — η εμπειρία πελάτη προηγείται."

market_title: "Μεγάλη, πολυκαναλική αγορά"
market_insight: "{buy24} αγόρασαν ηλεκτρική ή ηλεκτρονική συσκευή τα τελευταία δύο χρόνια. Οι μεγάλες αλυσίδες με φυσικά καταστήματα παραμένουν βασικό κανάλι, ενώ τα ηλεκτρονικά καταστήματα και τα marketplaces καλύπτουν πλέον σημαντικό μέρος των αγοραστών, με έντονη διαφοροποίηση ανά ηλικία."
criteria_title: "Η τιμή ανοίγει την πόρτα, η αξιοπιστία την κρατά"
criteria_insight: "Η τελική τιμή είναι το πρώτο κριτήριο, ιδιαίτερα για νοικοκυριά που τα βγάζουν πέρα δύσκολα. Ακολουθούν η διαθεσιμότητα, η εγγύηση/after-sales και η αξιοπιστία της παράδοσης — δηλαδή η συνέπεια μετά την πώληση."
aware_title: "Οικεία μάρκα, μικρότερη ενεργή πελατειακή βάση"
aware_insight: "Σχεδόν όλοι γνωρίζουν την αλυσίδα, αλλά περίπου ένας στους τρεις μόνο ως όνομα. Οι πελάτες μοιράζονται σχεδόν ισόποσα ανάμεσα σε φυσικό κατάστημα και e-shop· οι μεγάλες οικιακές συσκευές και τα κινητά οδηγούν τις αγορές."
image_title: "Θετική κλίση, αλλά ευρεία ουδέτερη ζώνη"
image_insight: "Η συνολική εικόνα είναι θετική για σχεδόν τους μισούς ({image}), η εμπιστοσύνη για {trust} και η τήρηση δεσμεύσεων για {commit}. Η μεγάλη ουδέτερη ζώνη είναι ευκαιρία: πρόκειται για κοινό που δεν έχει ακόμη ισχυρή προσωπική εμπειρία."
drivers_title: "Η εμπιστοσύνη χτίζεται με συνέπεια, διαφάνεια και ποιότητα"
drivers_insight: "Η παράδοση στον συμφωνημένο χρόνο, η ποιότητα των προϊόντων και οι διαφανείς τιμές και όροι είναι οι σημαντικότεροι παράγοντες εμπιστοσύνης· οι δίκαιες επιστροφές και η γρήγορη ανταπόκριση σε προβλήματα ακολουθούν."
cx_title: "Θετική εμπειρία για τους περισσότερους, με κρίσιμο το after-sales"
cx_insight: "{exp} των πελατών αξιολογούν θετικά την πιο πρόσφατη αγορά τους. Σημαντική καθυστέρηση παράδοσης αναφέρει περίπου {delay} — εκτίμηση που στηρίζεται στη συχνότητα καθυστερήσεων των online αγορών (Eurostat) — και κάποιο πρόβλημα {problem}."
recovery_title: "Η επίλυση καθορίζει την έκβαση"
recovery_insight: "Στους λίγους πελάτες με πρόβλημα, η κατάσταση της επίλυσης κρίνει την εμπιστοσύνη: όπου το πρόβλημα λύθηκε, η εμπιστοσύνη διατηρείται· όπου έμεινε άλυτο, μειώνεται αισθητά. Η βάση είναι μικρή και τα ποσοστά είναι ενδεικτικά."
comp_title: "Στην πρώτη τριάδα της επόμενης αγοράς"
comp_insight: "Η αλυσίδα βρίσκεται στις πρώτες επιλογές για την επόμενη αγορά ({consider}), δίπλα σε Public και Skroutz. {choose} δηλώνουν πιθανό να την επιλέξουν — η πρόθεση είναι σαφώς υψηλότερη στους υφιστάμενους πελάτες."
nps_title: "Η σύσταση ακολουθεί την προσωπική εμπειρία"
nps_insight: "Ο NPS ({nps}) δείχνει ότι οι επικριτές υπερτερούν των υποστηρικτών στο σύνολο, αλλά η εικόνα αντιστρέφεται στους πελάτες ({nps_cust}). Η ενεργή διάδοση είναι περιορισμένη: {advocacy} έχουν ενθαρρύνει κάποιον να αγοράσει."
csr_title: "Η κοινωνική προσφορά δεν αντικαθιστά την καλή εξυπηρέτηση"
csr_insight: "{csr} δηλώνουν ότι οι κοινωνικές δράσεις επηρεάζουν πολύ την εικόνα τους για μια εταιρεία, αλλά μόνο {csr_offset} ότι μπορούν να αντισταθμίσουν μια απογοητευτική εμπειρία. Η κοινωνική προσφορά λειτουργεί ενισχυτικά, όχι αντισταθμιστικά."
recover_title: "Γρήγορη και δίκαιη επίλυση = δεύτερη ευκαιρία"
recover_insight: "{second} θα έδιναν δεύτερη ευκαιρία σε μια εταιρεία που λύνει γρήγορα και δίκαια ένα πρόβλημα. Οι πιο αποτελεσματικές κινήσεις: ανταγωνιστικές τιμές, ακριβείς χρόνοι παράδοσης, απλούστερες επιστροφές και άμεση, ανθρώπινη εξυπηρέτηση."
prio_title: "Πρώτη προτεραιότητα: συνέπεια στις παραδόσεις"
prio_insight: "Οι παραδόσεις και η συνέπεια χρόνων, μαζί με τις τιμές, συγκεντρώνουν τις περισσότερες προτιμήσεις ως πρώτη προτεραιότητα. Οι περισσότεροι περιμένουν ουσιαστική πρώτη απάντηση μέσα σε 1–2 ημέρες ή την ίδια μέρα."
groups_title: "Η σχέση με την αλυσίδα διαφοροποιεί περισσότερο από τα δημογραφικά"
groups_insight: "Οι διαφορές μεταξύ ηλικιών και φύλων είναι μικρές· η μεγάλη διαφορά είναι ανάμεσα σε πελάτες και μη πελάτες. Η Αττική εμφανίζει υψηλότερους δείκτες, κυρίως επειδή εκεί η εξοικείωση με την αλυσίδα είναι υψηλότερη στο σενάριο."
rel_title: "Από την εμπειρία στην εμπιστοσύνη και στη σύσταση"
rel_insight: "Στους πελάτες με θετική εμπειρία η εμπιστοσύνη φτάνει {trust_exp_pos} (NPS {nps_exp_pos}), έναντι {trust_exp_neg} (NPS {nps_exp_neg}) σε όσους είχαν ουδέτερη ή αρνητική. Η εμπιστοσύνη αυξάνεται επίσης με την εξοικείωση: από {trust_name} σε όσους γνωρίζουν μόνο το όνομα σε {trust_well} σε όσους γνωρίζουν την αλυσίδα πολύ καλά."
concl_title: "Συμπεράσματα και προτάσεις"
concl_insight: "Η αναγνωρισιμότητα είναι δεδομένη· η ανάπτυξη της εμπιστοσύνης περνά από τη συνέπεια μετά την πώληση και από τη μετατροπή της ουδέτερης ζώνης σε προσωπική θετική εμπειρία."
recommendations:
  - {title: "Συνέπεια στις παραδόσεις", text: "Ακριβείς χρόνοι και προληπτική ενημέρωση σε κάθε παραγγελία· είναι ο πρώτος παράγοντας εμπιστοσύνης και η πρώτη προτεραιότητα βελτίωσης."}
  - {title: "After-sales με δέσμευση χρόνου", text: "Πρώτη ουσιαστική απάντηση εντός 1–2 ημερών και παρακολούθηση μέχρι την επίλυση· η άλυτη υπόθεση είναι το σημείο όπου χάνεται η εμπιστοσύνη."}
  - {title: "Απλές και δίκαιες επιστροφές", text: "Σαφείς όροι και γρήγορη αντικατάσταση· στηρίζουν τη «δεύτερη ευκαιρία» που δηλώνουν ότι θα έδιναν {second}."}
  - {title: "Μετατροπή της ουδέτερης ζώνης", text: "Στοχευμένη εμπειρία για όσους γνωρίζουν την αλυσίδα μόνο ως όνομα (χαμηλότερη εμπιστοσύνη: {trust_name})· η εξοικείωση συνδέεται με υψηλότερη εμπιστοσύνη."}
  - {title: "Κοινωνική προσφορά ως ενίσχυση", text: "Επικοινωνία της κοινωνικής προσφοράς μόνο σε συνδυασμό με αποδεδειγμένη βελτίωση της εξυπηρέτησης — δεν αντισταθμίζει κακή εμπειρία."}
  - {title: "Επιβεβαίωση με έρευνα πεδίου", text: "Πριν από αποφάσεις: σύντομη πραγματική μέτρηση στους βασικούς δείκτες (εμπιστοσύνη, NPS, προβλήματα after-sales), ώστε να βαθμονομηθεί το σενάριο."}

method_insight: "Η έρευνα είναι συνθετική: οι απαντήσεις παράγονται στατιστικά, όχι από πραγματικούς ερωτώμενους. Όπου υπάρχει εμπειρική βάση χρησιμοποιείται· όπου δεν υπάρχει, το σενάριο είναι ρητό και σημειώνεται."
method:
  Πληθυσμός: "Βαθμονομημένος συνθετικός πληθυσμός ενηλίκων (GLOPOP-S, βαθμονόμηση σε επίσημα στοιχεία ΕΛΣΤΑΤ/Eurostat 2025: ηλικία, φύλο, περιφέρεια, μόρφωση)"
  Εμπειρικά στοιχεία: "Δημογραφικά από τον πληθυσμό· δείκτες Eurostat για online αγορές και προβλήματα παράδοσης/παραπόνων ανά ηλικία, φύλο και μόρφωση· εκτιμώμενα χαρακτηριστικά νοικοκυριού από ελληνικά μικροδεδομένα"
  Ερωτήσεις μάρκας: "Δεν υπάρχουν δημόσια δεδομένα πληθυσμού για τη συγκεκριμένη μάρκα· οι απαντήσεις προκύπτουν από ρητό σενάριο με ελεγμένους κανόνες συνοχής"
  Έλεγχοι: "Λογική διαδρομών, λογικοί περιορισμοί και κανόνες συνοχής, ποικιλία, σύνθεση δείγματος, σταθερότητα σε επαναλήψεις και ανάλυση ευαισθησίας του σεναρίου"
  Περιορισμοί: "Οι εκτιμήσεις σεναρίου δεν είναι μετρήσεις· οι βάσεις κάτω από 30 είναι ενδεικτικές· δεν υπολογίζεται περιθώριο σφάλματος δειγματοληψίας με την κλασική έννοια"
