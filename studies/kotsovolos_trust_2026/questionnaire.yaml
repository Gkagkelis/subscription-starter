questionnaire_id: kotsovolos_trust_2026_v1
title: "Η Εμπιστοσύνη μετά την Αγορά"
language: el
consistency_rules:
  - id: C1_trust_vs_recommend
    description: "Πολύ υψηλή εμπιστοσύνη αλλά πολύ χαμηλή πρόθεση σύστασης"
    when: "Q7 == '5' and num(Q22) <= 2"
  - id: C2_delay_reaction
    description: "Πλήρης ικανοποίηση χωρίς ενημέρωση αλλά δυσαρέσκεια με ενημέρωση"
    when: "Q12b == '5' and Q12a == '1'"
blocks:
  - id: B0
    title: "Έλεγχος καταλληλότητας και δημογραφικά"
    questions:
      - id: S1
        text: "Τους τελευταίους 24 μήνες, έχετε αγοράσει κάποια ηλεκτρική συσκευή ή ηλεκτρονικό είδος (για εσάς ή το νοικοκυριό σας);"
        type: single_choice
        intent: experience
        options: [{code: "1", label: "Ναι"}, {code: "2", label: "Όχι"}]
        screening: {terminate_if: ["2"]}
      - {id: D1, text: "Φύλο", type: single_choice, intent: demographic, profile_field: gender, options: [{code: "1", label: "Άνδρας"}, {code: "2", label: "Γυναίκα"}], profile_map: {male: "1", female: "2"}}
      - id: D2
        text: "Ηλικία"
        type: single_choice
        intent: demographic
        profile_field: age_band
        options: [{code: "18-24", label: "18–24"}, {code: "25-34", label: "25–34"}, {code: "35-44", label: "35–44"}, {code: "45-54", label: "45–54"}, {code: "55-64", label: "55–64"}, {code: "65+", label: "65+"}]
      - id: D3
        text: "Περιφέρεια κατοικίας"
        type: single_choice
        intent: demographic
        profile_field: region
        options: [Αττική, Κεντρική Μακεδονία, Θεσσαλία, Κρήτη, Δυτική Ελλάδα, Ανατολική Μακεδονία & Θράκη, Πελοπόννησος, Στερεά Ελλάδα, Ήπειρος, Δυτική Μακεδονία, Ιόνια Νησιά, Βόρειο Αιγαίο, Νότιο Αιγαίο]
        profile_map: {Αττική: "1", Κεντρική Μακεδονία: "2", Θεσσαλία: "3", Κρήτη: "4", Δυτική Ελλάδα: "5", Ανατολική Μακεδονία & Θράκη: "6", Πελοπόννησος: "7", Στερεά Ελλάδα: "8", Ήπειρος: "9", Δυτική Μακεδονία: "10", Ιόνια Νησιά: "11", Βόρειο Αιγαίο: "12", Νότιο Αιγαίο: "13"}
  - id: B1
    title: "1. Αγοραστικές συνήθειες ηλεκτρικών συσκευών"
    questions:
      - id: Q1
        text: "Από ποια κανάλια έχετε αγοράσει ηλεκτρικές συσκευές ή ηλεκτρονικά τους τελευταίους 24 μήνες;"
        type: multiple_choice
        intent: experience
        randomize_options: true
        anchor: ["7"]
        min_choices: 1
        max_choices: 4
        options: [{code: "1", label: "Φυσικό κατάστημα αλυσίδας ηλεκτρικών ειδών"}, {code: "2", label: "Ηλεκτρονικό κατάστημα αλυσίδας ηλεκτρικών ειδών"}, {code: "3", label: "Online marketplace / πλατφόρμα σύγκρισης τιμών"}, {code: "4", label: "Κατάστημα ή e-shop του κατασκευαστή"}, {code: "5", label: "Μικρό τοπικό κατάστημα"}, {code: "6", label: "Υπεραγορά / πολυκατάστημα"}, {code: "7", label: "Άλλο"}]
      - id: Q2
        text: "Πόσο συχνά αγοράζετε μεγάλη οικιακή συσκευή (π.χ. πλυντήριο, ψυγείο, κουζίνα);"
        type: single_choice
        intent: experience
        options: [{code: "1", label: "Κάθε χρόνο ή συχνότερα"}, {code: "2", label: "Κάθε 2–3 χρόνια"}, {code: "3", label: "Κάθε 4–6 χρόνια"}, {code: "4", label: "Σπανιότερα"}, {code: "5", label: "Δεν αγοράζω εγώ τέτοιες συσκευές"}]
      - id: Q3
        text: "Περίπου πόσα χρήματα θα διαθέτατε για μια νέα μεγάλη οικιακή συσκευή αν τη χρειαζόσασταν σήμερα;"
        type: numeric
        intent: hypothetical_choice
        numeric: {min: 100, max: 3000, integer: true, unit: "€"}
  - id: B2
    title: "2. Κριτήρια επιλογής καταστήματος"
    questions:
      - id: Q4
        text: "Κατατάξτε τα τρία πιο σημαντικά κριτήρια όταν επιλέγετε από πού θα αγοράσετε μια ηλεκτρική συσκευή."
        type: ranking
        intent: attitude
        rank_k: 3
        randomize_options: true
        options: [{code: "1", label: "Χαμηλή τιμή"}, {code: "2", label: "Αξιόπιστη και έγκαιρη παράδοση"}, {code: "3", label: "Εξυπηρέτηση μετά την πώληση"}, {code: "4", label: "Εγγύηση και επισκευές"}, {code: "5", label: "Ποικιλία προϊόντων"}, {code: "6", label: "Συμβουλές προσωπικού"}, {code: "7", label: "Εύκολες επιστροφές"}, {code: "8", label: "Κοντινό κατάστημα"}]
      - id: Q5
        text: "Πόσο σημαντική είναι για εσάς η εξυπηρέτηση μετά την αγορά, όταν επιλέγετε κατάστημα ηλεκτρικών ειδών;"
        type: likert
        intent: attitude
        scale: {points: 5, labels: {1: "Καθόλου σημαντική", 2: "Λίγο", 3: "Μέτρια", 4: "Πολύ", 5: "Εξαιρετικά σημαντική"}}
  - id: B3
    title: "3. Εμπιστοσύνη στον Κωτσόβολο"
    questions:
      - id: Q6
        text: "Γνωρίζετε την αλυσίδα καταστημάτων ηλεκτρικών ειδών Κωτσόβολος;"
        type: single_choice
        intent: knowledge
        options: [{code: "1", label: "Ναι, τη γνωρίζω"}, {code: "2", label: "Την έχω ακουστά μόνο"}, {code: "3", label: "Όχι"}]
      - id: Q7
        text: "Πόσο εμπιστεύεστε τον Κωτσόβολο ως κατάστημα για την αγορά ηλεκτρικών ειδών;"
        type: likert
        intent: attitude
        condition: "Q6 in ['1','2']"
        scale: {points: 5, labels: {1: "Καθόλου", 2: "Λίγο", 3: "Μέτρια", 4: "Πολύ", 5: "Απόλυτα"}}
      - id: Q8
        text: "Έχετε αγοράσει από τον Κωτσόβολο (κατάστημα ή online) τους τελευταίους 12 μήνες;"
        type: single_choice
        intent: experience
        condition: "Q6 == '1'"
        options: [{code: "1", label: "Ναι"}, {code: "2", label: "Όχι"}, {code: "3", label: "Δεν θυμάμαι"}]
      - id: Q9
        text: "Σε ποιο βαθμό συμφωνείτε: «Ο Κωτσόβολος τηρεί όσα υπόσχεται στους πελάτες του»;"
        type: likert
        intent: attitude
        condition: "Q6 == '1'"
        scale: {points: 5, labels: {1: "Διαφωνώ απόλυτα", 2: "Διαφωνώ", 3: "Ούτε συμφωνώ ούτε διαφωνώ", 4: "Συμφωνώ", 5: "Συμφωνώ απόλυτα"}}
  - id: B4
    title: "4. Αξιοπιστία παράδοσης"
    questions:
      - id: Q10
        text: "Πόσο σημαντικό είναι για εσάς να παραδίδεται μια μεγάλη συσκευή ακριβώς τη μέρα και ώρα που συμφωνήθηκε;"
        type: likert
        intent: attitude
        scale: {points: 5, labels: {1: "Καθόλου σημαντικό", 5: "Εξαιρετικά σημαντικό"}}
      - id: Q11
        text: "Αν μια παράδοση καθυστερούσε, μετά από πόσο χρόνο θα επικοινωνούσατε με το κατάστημα;"
        type: single_choice
        intent: hypothetical_choice
        options: [{code: "1", label: "Αμέσως, την ίδια μέρα"}, {code: "2", label: "Μετά από 1 ημέρα"}, {code: "3", label: "Μετά από 2–3 ημέρες"}, {code: "4", label: "Μετά από μία εβδομάδα"}, {code: "5", label: "Θα περίμενα να επικοινωνήσουν εκείνοι"}]
  - id: B5
    title: "5. Καθυστερήσεις και επικοινωνία (Σενάριο 1)"
    questions:
      - id: Q12a
        text: "Πόσο ικανοποιημένος/η θα ήσασταν από τον τρόπο που χειρίστηκε το κατάστημα την καθυστέρηση;"
        type: scenario
        intent: hypothetical_choice
        sensitivity_group: "Σενάριο 1: Καθυστέρηση παράδοσης"
        variant_label: "Καθυστέρηση 3 ημερών με έγκαιρη ενημέρωση και νέο ραντεβού"
        scenario: {id: SC1a, text: "Αγοράσατε ένα ψυγείο 650 € από μεγάλη αλυσίδα ηλεκτρικών ειδών. Η παράδοση καθυστερεί 3 ημέρες. Το κατάστημα σας ενημερώνει με SMS και τηλέφωνο από την προηγούμενη μέρα, εξηγεί τον λόγο και κλείνει μαζί σας νέο ραντεβού."}
        options: [{code: "1", label: "Καθόλου ικανοποιημένος/η"}, {code: "2", label: "Λίγο"}, {code: "3", label: "Μέτρια"}, {code: "4", label: "Πολύ"}, {code: "5", label: "Απόλυτα ικανοποιημένος/η"}]
      - id: Q12b
        text: "Πόσο ικανοποιημένος/η θα ήσασταν από τον τρόπο που χειρίστηκε το κατάστημα την καθυστέρηση;"
        type: scenario
        intent: hypothetical_choice
        sensitivity_group: "Σενάριο 1: Καθυστέρηση παράδοσης"
        variant_label: "Καθυστέρηση 3 ημερών χωρίς ενημέρωση"
        scenario: {id: SC1b, text: "Αγοράσατε ένα ψυγείο 650 € από μεγάλη αλυσίδα ηλεκτρικών ειδών. Η παράδοση καθυστερεί 3 ημέρες. Κανείς δεν σας ενημερώνει· μαθαίνετε για την καθυστέρηση όταν τηλεφωνείτε εσείς."}
        options: [{code: "1", label: "Καθόλου ικανοποιημένος/η"}, {code: "2", label: "Λίγο"}, {code: "3", label: "Μέτρια"}, {code: "4", label: "Πολύ"}, {code: "5", label: "Απόλυτα ικανοποιημένος/η"}]
      - id: Q13
        text: "Αν καθυστερούσε μια παράδοση, με ποιους τρόπους θα θέλατε να σας ενημερώνει το κατάστημα;"
        type: multiple_choice
        intent: attitude
        max_choices: 3
        randomize_options: true
        options: [{code: "1", label: "SMS"}, {code: "2", label: "Τηλεφώνημα"}, {code: "3", label: "Email"}, {code: "4", label: "Ειδοποίηση στην εφαρμογή"}, {code: "5", label: "Viber / WhatsApp"}]
  - id: B6
    title: "6. Ελαττωματικά προϊόντα (Σενάριο 2)"
    questions:
      - id: Q14
        text: "Τι θα κάνατε πρώτα;"
        type: scenario
        intent: hypothetical_choice
        scenario: {id: SC2, text: "Δέκα ημέρες μετά την αγορά, το νέο σας πλυντήριο (550 €) σταματά να λειτουργεί. Είναι εντός εγγύησης."}
        options: [{code: "1", label: "Θα επικοινωνούσα με το κατάστημα αγοράς"}, {code: "2", label: "Θα επικοινωνούσα με τον κατασκευαστή"}, {code: "3", label: "Θα πήγαινα αυτοπροσώπως στο κατάστημα"}, {code: "4", label: "Θα έγραφα κριτική ή ανάρτηση online"}, {code: "5", label: "Θα απευθυνόμουν σε φορέα προστασίας καταναλωτή"}]
      - id: Q15
        text: "Σε αυτό το σενάριο, μέσα σε πόσες ημέρες θα θεωρούσατε λογική τη λύση του προβλήματος;"
        type: numeric
        intent: hypothetical_choice
        numeric: {min: 1, max: 60, integer: true, unit: "ημέρες"}
  - id: B7
    title: "7. Επισκευή, αντικατάσταση, επιστροφή χρημάτων (Σενάριο 3)"
    questions:
      - id: Q16
        text: "Αν μια νέα συσκευή αποδεικνυόταν ελαττωματική, ποια λύση θα προτιμούσατε;"
        type: single_choice
        intent: hypothetical_choice
        options: [{code: "1", label: "Επισκευή"}, {code: "2", label: "Αντικατάσταση με καινούργια"}, {code: "3", label: "Επιστροφή χρημάτων"}, {code: "4", label: "Πιστωτικό σημείωμα για μελλοντική αγορά"}]
      - id: Q17
        text: "Ποια από τις δύο προσφορές για το ίδιο πλυντήριο θα επιλέγατε;"
        type: dce
        intent: hypothetical_choice
        dce:
          alternatives: [{id: A, label: "Κατάστημα Α"}, {id: B, label: "Κατάστημα Β"}]
          attributes:
            "Τιμή": ["529 €", "579 €", "629 €"]
            "Παράδοση στην ώρα της": ["σχεδόν πάντα", "συνήθως", "συχνά καθυστερεί"]
            "Εξυπηρέτηση μετά την πώληση": ["τεχνικός στο σπίτι σε 48 ώρες", "τηλεφωνικό κέντρο", "μόνο μέσω email"]
            "Επιστροφή": ["14 ημέρες", "30 ημέρες"]
          none_option: true
          none_label: "Καμία από τις δύο"
  - id: B8
    title: "8. Ανάκτηση εμπιστοσύνης (Σενάριο 4)"
    questions:
      - id: Q18a
        text: "Μετά από αυτόν τον χειρισμό, πόσο θα εμπιστευόσασταν ξανά το κατάστημα;"
        type: scenario
        intent: hypothetical_choice
        sensitivity_group: "Σενάριο 4: Αποκατάσταση μετά από πρόβλημα"
        variant_label: "Άμεση αντικατάσταση, συγγνώμη και κουπόνι"
        scenario: {id: SC4a, text: "Μια τηλεόραση που αγοράσατε παρουσιάζει βλάβη. Το κατάστημα ζητά συγγνώμη, την αντικαθιστά μέσα σε 2 ημέρες και σας δίνει κουπόνι 30 € για επόμενη αγορά."}
        options: [{code: "1", label: "Καθόλου"}, {code: "2", label: "Λίγο"}, {code: "3", label: "Μέτρια"}, {code: "4", label: "Πολύ"}, {code: "5", label: "Απόλυτα"}]
      - id: Q18b
        text: "Μετά από αυτόν τον χειρισμό, πόσο θα εμπιστευόσασταν ξανά το κατάστημα;"
        type: scenario
        intent: hypothetical_choice
        sensitivity_group: "Σενάριο 4: Αποκατάσταση μετά από πρόβλημα"
        variant_label: "Αντικατάσταση μετά από 2 εβδομάδες, χωρίς συγγνώμη"
        scenario: {id: SC4b, text: "Μια τηλεόραση που αγοράσατε παρουσιάζει βλάβη. Το κατάστημα την αντικαθιστά ύστερα από 2 εβδομάδες και αρκετά τηλεφωνήματα, χωρίς συγγνώμη ή αποζημίωση."}
        options: [{code: "1", label: "Καθόλου"}, {code: "2", label: "Λίγο"}, {code: "3", label: "Μέτρια"}, {code: "4", label: "Πολύ"}, {code: "5", label: "Απόλυτα"}]
      - id: Q19
        text: "Κατατάξτε τις τρεις κινήσεις που θα σας έκαναν πιο εύκολα να εμπιστευτείτε ξανά ένα κατάστημα μετά από κακή εμπειρία."
        type: ranking
        intent: attitude
        rank_k: 3
        randomize_options: true
        options: [{code: "1", label: "Γρήγορη λύση του προβλήματος"}, {code: "2", label: "Ειλικρινής συγγνώμη"}, {code: "3", label: "Οικονομική αποζημίωση ή κουπόνι"}, {code: "4", label: "Συνεχής ενημέρωση για την πρόοδο"}, {code: "5", label: "Ένας υπεύθυνος που αναλαμβάνει την υπόθεση"}, {code: "6", label: "Επέκταση εγγύησης"}]
  - id: B9
    title: "9. Επαναγορά και επιλογή ανταγωνιστή (Σενάριο 5)"
    questions:
      - id: Q20a
        text: "Πόσο πιθανό είναι να ξαναγοράσετε από αυτό το κατάστημα;"
        type: scenario
        intent: intention
        sensitivity_group: "Σενάριο 5: Επιστροφή μετά από κακή εμπειρία"
        variant_label: "Το πρόβλημα λύθηκε γρήγορα και σωστά"
        scenario: {id: SC5a, text: "Την τελευταία φορά που αγοράσατε από ένα κατάστημα ηλεκτρικών ειδών είχατε πρόβλημα με την παράδοση, το οποίο όμως λύθηκε γρήγορα και σωστά. Τώρα χρειάζεστε νέα συσκευή."}
        options: [{code: "1", label: "Καθόλου πιθανό"}, {code: "2", label: "Λίγο πιθανό"}, {code: "3", label: "Μέτρια"}, {code: "4", label: "Πολύ πιθανό"}, {code: "5", label: "Σίγουρα"}]
      - id: Q20b
        text: "Πόσο πιθανό είναι να ξαναγοράσετε από αυτό το κατάστημα;"
        type: scenario
        intent: intention
        sensitivity_group: "Σενάριο 5: Επιστροφή μετά από κακή εμπειρία"
        variant_label: "Το πρόβλημα δεν λύθηκε ικανοποιητικά"
        scenario: {id: SC5b, text: "Την τελευταία φορά που αγοράσατε από ένα κατάστημα ηλεκτρικών ειδών είχατε πρόβλημα με την παράδοση, το οποίο δεν λύθηκε ικανοποιητικά. Τώρα χρειάζεστε νέα συσκευή."}
        options: [{code: "1", label: "Καθόλου πιθανό"}, {code: "2", label: "Λίγο πιθανό"}, {code: "3", label: "Μέτρια"}, {code: "4", label: "Πολύ πιθανό"}, {code: "5", label: "Σίγουρα"}]
      - id: Q21
        text: "Αν αποφασίζατε να αγοράσετε αλλού μετά από κακή εμπειρία, πού θα στρεφόσασταν πιθανότερα;"
        type: single_choice
        intent: intention
        options: [{code: "1", label: "Σε άλλη αλυσίδα ηλεκτρικών ειδών"}, {code: "2", label: "Σε online marketplace"}, {code: "3", label: "Στο e-shop του κατασκευαστή"}, {code: "4", label: "Σε μικρό τοπικό κατάστημα"}, {code: "5", label: "Θα αγόραζα πάλι από το ίδιο κατάστημα"}]
      - id: Q22
        text: "Σε κλίμακα 0–10, πόσο πιθανό είναι να συστήνατε τον Κωτσόβολο σε έναν φίλο ή συγγενή;"
        type: numeric
        intent: intention
        condition: "Q6 == '1'"
        numeric: {min: 0, max: 10, integer: true}
  - id: B10
    title: "10. Κοινωνική προσφορά και εταιρική εικόνα (Σενάριο 6)"
    questions:
      - id: Q23
        text: "Ποιο από τα δύο καταστήματα θα προτιμούσατε για την επόμενη αγορά σας;"
        type: scenario
        intent: hypothetical_choice
        scenario: {id: SC6, text: "Κατάστημα Α: έχει γνωστά προγράμματα κοινωνικής προσφοράς (π.χ. δωρεές συσκευών σε σχολεία), αλλά η καθημερινή εξυπηρέτηση είναι μέτρια. Κατάστημα Β: δεν έχει γνωστά κοινωνικά προγράμματα, αλλά η καθημερινή εξυπηρέτηση είναι εξαιρετική. Οι τιμές είναι ίδιες."}
        options: [{code: "1", label: "Σίγουρα το Α"}, {code: "2", label: "Μάλλον το Α"}, {code: "3", label: "Αδιάφορο"}, {code: "4", label: "Μάλλον το Β"}, {code: "5", label: "Σίγουρα το Β"}]
      - id: Q24
        text: "Πόσο σημαντική είναι για εσάς η κοινωνική προσφορά μιας εταιρείας όταν αποφασίζετε από πού θα αγοράσετε;"
        type: likert
        intent: attitude
        scale: {points: 5, labels: {1: "Καθόλου σημαντική", 5: "Εξαιρετικά σημαντική"}}
      - id: Q25
        text: "Γνωρίζετε κάποια δράση κοινωνικής προσφοράς του Κωτσόβολου;"
        type: single_choice
        intent: knowledge
        condition: "Q6 in ['1','2']"
        options: [{code: "1", label: "Ναι, γνωρίζω συγκεκριμένη δράση"}, {code: "2", label: "Έχω ακούσει αόριστα"}, {code: "3", label: "Όχι"}]
      - id: Q26
        text: "Τι θα έκανε ένα κατάστημα ηλεκτρικών ειδών να κερδίσει ή να ξανακερδίσει την εμπιστοσύνη σας;"
        type: open
        intent: attitude
        max_chars: 400
  - id: B11
    title: "Γενικές στάσεις"
    questions:
      - id: Q27
        text: "Πόσο επηρεάζουν οι online κριτικές άλλων πελατών την επιλογή καταστήματος ηλεκτρικών ειδών;"
        type: likert
        intent: attitude
