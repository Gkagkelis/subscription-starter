# Επιμελημένες πηγές ερευνητικού πλαισίου (επαληθευμένες 2026-10-31 από τη συνεδρία· βλ. verified_by ανά πηγή).
# Χρήση: ΜΟΝΟ ως υπόβαθρο για τις συνθετικές απαντήσεις. Δεν αναπαράγονται αριθμοί/ποσοστά και δεν μετατρέπονται σε πιθανότητες επιλογής.
# Η αποδοχή κάθε πηγής κρίνεται από τους κανόνες συνάφειας v2 (research.concepts / domain_terms / off_topic_terms / max_age_years).
sources:
- id: src:ec-ccs-2024-greece-factsheet
  title: 'Consumer conditions survey - Consumers at home in the single market - 2025 edition: Country factsheet Greece'
  title_en: 2024 Consumer conditions survey - Country factsheets (Greece)
  publisher: European Commission, Directorate-General for Justice and Consumers (fieldwork by Ipsos)
  url: https://commission.europa.eu/document/download/e3ed8322-eb20-4355-b013-c21674f014e9_en?filename=Greece%20factsheet.pdf
  date: 2025-03
  country: GR (with EU27 average and range)
  population: General public aged 18+ in Greece (nationally representative), CATI telephone interviews; fieldwork 4-30 November 2024
  sample: 1,000 per country (Greece 1,000), per the factsheet's technical note
  licence: CC BY 4.0 (European Commission legal notice for Commission-owned content, unless otherwise noted)
  concepts:
  - trust
  - complaints
  - after_sales
  - warranty
  evidence_type: survey_statistics
  supports: Greece-vs-EU27 background on whether consumers think retailers respect their rights, trust in public authorities and consumer organisations,
    ease of out-of-court/court dispute settlement, share who experienced a problem with goods/services and whether they complained (to retailer,
    manufacturer, authority, ECC, ADR), reasons for not complaining, and what people did with a product that failed outside the legal guarantee
    (repair vs replace).
  limitations: Covers all goods and services, not electrical/electronics retailers specifically; the "reasons for not taking action" items are
    flagged in the factsheet as indicative for Greece because of small bases.
  verified_by: opened page (publication page and the PDF text)
  keywords:
  - consumer trust
  - complaints
  - redress
  - ADR
  - legal guarantee
  - εμπιστοσύνη καταναλωτών
  - καταγγελίες
  - επίλυση διαφορών
  data_year: 2024
  verified_on: '2026-10-31'
- id: src:ec-consumer-conditions-scoreboard-2025
  title: 2025 Consumer Conditions Scoreboard
  publisher: European Commission, Directorate-General for Justice and Consumers
  url: https://commission.europa.eu/strategy-and-policy/policies/consumers/consumer-protection-policy/key-consumer-data_en
  date: 2025-03
  country: EU27 incl. GR (plus IS, NO)
  population: Consumers aged 18+ in EU27, Iceland and Norway (2024 Consumer Conditions Survey); same survey as the Greece factsheet
  sample: unknown (the main report was not opened; the factsheet states 1,000 per country, 500 in LU, MT, CY, IS)
  licence: CC BY 4.0 (European Commission legal notice for Commission-owned content, unless otherwise noted)
  concepts:
  - trust
  - complaints
  - after_sales
  - warranty
  evidence_type: survey_statistics
  supports: EU-level frame and cross-country comparison for the Greek factsheet indicators (consumer confidence, problems and complaints, redress,
    online purchasing); the landing page also links the full data set, methodology metadata and an interactive dashboard for comparable European
    markets.
  limitations: Main report PDF (13.39 MB) was not opened, so its exact chapters and Greece coverage are unverified; not specific to electronics
    retail.
  verified_by: opened page (key consumer data landing page listing the 2025 Scoreboard, dated 14 March 2025)
  keywords:
  - consumer conditions scoreboard
  - consumer confidence
  - EU comparison
  - problems and complaints
