- id: src:greca-eltrun-ecommerce-2026
  title: Έρευνα Ηλεκτρονικού Εμπορίου 2026 - Η συμπεριφορά του Έλληνα Καταναλωτή στις Διαδικτυακές Αγορές
  title_en: E-commerce Survey 2026 - Greek consumer behaviour in online markets
  publisher: GR.EC.A (Hellenic E-commerce Association) and ELTRUN, Athens University of Economics and Business, under the auspices of eQuality
    NGO
  url: https://www.newmoney.gr/wp-content/uploads/2026/05/Greca-eCommerce-Report-2026.pdf
  date: 2026-05
  country: GR
  population: Greek consumers who shop online (online questionnaire, multiple-choice questions)
  sample: '600'
  licence: unknown – see site
  concepts:
  - trust
  - delivery
  - after_sales
  evidence_type: survey_statistics
  supports: Greek-specific background on what drives trust in e-shops (known brand/chain, prompt service before and after purchase, clear terms,
    reviews, trust certifications), delivery and pickup preferences (home delivery, lockers), payment methods, and online purchasing of electrical
    appliances as a category.
  limitations: Online opt-in sample of online shoppers, not representative of all Greek consumers; sponsored by industry; PDF is hosted by a news
    site (newmoney.gr), no official GR.EC.A page found; covers trust and delivery more than complaints or warranty.
  verified_by: opened page (report PDF text; press coverage on cnn.gr and naftemporiki.gr also opened)
