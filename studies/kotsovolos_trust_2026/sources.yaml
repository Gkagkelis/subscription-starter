- id: src:stk-annual-report-2024
  title: Ετήσια Έκθεση 2024 - Συνήγορος του Καταναλωτή
  title_en: Annual Report 2024 - Hellenic Consumer Ombudsman
  publisher: Συνήγορος του Καταναλωτή (Hellenic Consumer Ombudsman), incl. ECC Greece
  url: https://www.synigoroskatanaloti.gr/el/etisia-ekthesi-2024
  date: 2026-05
  country: GR
  population: Complaints (αναφορές) submitted by consumers to the Consumer Ombudsman in 2024 (and to ECC Greece for the combined total)
  sample: administrative data (18,192 complaints to the Ombudsman in 2024; 19,061 including ECC Greece)
  licence: All rights reserved (site footer); no reuse licence stated
  concepts:
  - complaints
  - delivery
  - after_sales
  - warranty
  - returns
  evidence_type: administrative_statistics
  supports: Greek complaint landscape by sector and complaint type, including consumer-goods sub-sectors ICT goods, large household appliances
    and non-ICT/entertainment electronics, complaint content such as delivery of goods (non- or partial delivery, delay, customer service), product
    quality, sales method (e-commerce vs face to face) and mediation outcomes; also case examples on courier/postal non-delivery and damaged parcels.
  limitations: Complaint counts reflect who chooses to contact the Ombudsman, not prevalence among consumers; 92-page Greek PDF (report PDF dated
    March 2026, web page dated 6 May 2026) with sector charts partly only as images.
  verified_by: opened page (web page and full report PDF text)
  keywords:
  - consumer ombudsman
  - complaints by sector
  - household appliances
  - ICT goods
  - delivery
  - Συνήγορος του Καταναλωτή
  - αναφορές καταναλωτών
  - μεγάλες οικιακές συσκευές
