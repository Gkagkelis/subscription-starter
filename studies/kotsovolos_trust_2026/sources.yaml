  verified_on: '2026-10-31'
- id: src:eurostat-isoc-ec-iprb21
  title: Internet purchases - problems encountered (2021 onwards)
  publisher: Eurostat (ICT usage in households and by individuals survey)
  url: https://ec.europa.eu/eurostat/databrowser/view/isoc_ec_iprb21/default/table?lang=en
  date: 2026-04
  country: EU27 incl. GR (Greece reported separately)
  population: Individuals (all individuals and breakdowns by age, sex, education etc.) who bought via a website or app in the previous 3 months;
    Greece data available for 2021, 2023 and 2025
  sample: unknown
  licence: CC BY 4.0 per Eurostat copyright notice (reuse permitted with source acknowledgement)
  concepts:
  - delivery
  - complaints
  - warranty
  evidence_type: survey_statistics
  supports: Share of Greek online buyers reporting delivery slower than indicated, wrong or damaged goods delivered, difficult complaints/redress
    or no satisfactory response after complaint, and difficulty finding information on guarantees/legal rights (Eurostat 2021/2023/2025), compared
    with other EU countries. DOI 10.2908/ISOC_EC_IPRB21.
  limitations: Online purchases of all goods and services, not electronics retail or in-store buying; problem items are not directly comparable
    with the pre-2020 series (indicator wording changed). Data last updated 17 April 2026.
  verified_by: opened page (Eurostat dissemination API metadata for geo=EL; the JavaScript databrowser did not render)
  keywords:
  - online shopping problems
  - late delivery
  - damaged goods
  - wrong goods
  - redress
  - προβλήματα ηλεκτρονικών αγορών
  - καθυστέρηση παράδοσης
  data_year: 2025
  verified_on: '2026-10-31'
- id: src:eurostat-isoc-ec-iprb
  title: Problems encountered by individuals when buying/ordering over the internet (2002-2019)
  publisher: Eurostat (ICT usage in households and by individuals survey)
  url: https://ec.europa.eu/eurostat/databrowser/view/isoc_ec_iprb/default/table?lang=en
  date: 2024-06
  country: EU27 incl. GR (Greece reported separately)
  population: Individuals who bought/ordered goods or services over the internet for private use; series ends in 2019
  sample: unknown
  licence: CC BY 4.0 per Eurostat copyright notice (reuse permitted with source acknowledgement)
  concepts:
  - delivery
  - complaints
  - warranty
  evidence_type: survey_statistics
  supports: Pre-2020 trend context (use 2016-2019 only) for Greek online buyers reporting slower-than-indicated delivery, wrong or damaged goods,
    difficulties concerning guarantees, and difficult complaints/redress.
  limitations: Discontinued after 2019 and replaced by isoc_ec_iprb21 with changed wording; years before 2016 fall outside the study's recency
    rule.
  verified_by: opened page (Eurostat dissemination API metadata for geo=EL; label states 2002-2019, updated 16 June 2024)
  keywords:
  - online shopping problems
  - guarantees
  - late delivery
