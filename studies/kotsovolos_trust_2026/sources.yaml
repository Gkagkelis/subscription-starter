- id: src:eu-directive-2019-771
  title: Directive (EU) 2019/771 of the European Parliament and of the Council of 20 May 2019 on certain aspects concerning contracts for the
    sale of goods, amending Regulation (EU) 2017/2394 and Directive 2009/22/EC, and repealing Directive 1999/44/EC
  publisher: European Parliament and Council of the EU (Official Journal L 136, 22.5.2019, p. 28-50)
  url: https://eur-lex.europa.eu/eli/dir/2019/771/oj/eng
  date: 2019-05
  country: EU27 incl. GR
  population: Consumer sales contracts for goods in the EU (legal text)
  sample: legal text
  licence: unknown – see site
  concepts:
  - warranty
  - returns
  - after_sales
  evidence_type: legal_framework
  supports: Legal context for the seller's liability for lack of conformity (the 2-year legal guarantee), and the consumer's remedies of repair,
    replacement, price reduction or termination/refund that a post-purchase scenario can refer to.
  limitations: Sets minimum harmonised rules; Greek application is via Law 4967/2022. EUR-Lex text could not be opened (bot challenge), so article-level
    details were not checked here; EUR-Lex lists a later amendment by Directive (EU) 2024/1799.
  verified_by: search result
  keywords:
