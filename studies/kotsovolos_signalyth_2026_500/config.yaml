  approved_by: "ερευνητικός συνεργάτης (μέσω του χρήστη)"
  # Πάγωμα: η μηχανή αρνείται κάθε μη δοκιμαστική εκτέλεση αν αλλάξει οποιοδήποτε από τα αρχεία (κείμενο, ids, επιλογές, skip logic, περιορισμοί)
  frozen:
