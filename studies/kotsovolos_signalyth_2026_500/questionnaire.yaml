language: el
source_meta:
  schema_version: '1.0'
  study_id: kotsovolos_signalyth_2026_500
  title: Κωτσόβολος | Συνθετική προσομοίωση 500 ολοκληρωμένων συνεντεύξεων
  status: DRAFT_PENDING_PARTNER_APPROVAL
  target_completes: 500
  sample_size_basis: completes
  population: Ενήλικοι 18+ κάτοικοι Ελλάδας
  sampling_policy: general_population; no forced Kotsovolos buyer quota; report natural incidence
  fieldwork_type: synthetic_simulation_not_real_respondents
  source: Viewscope / Signalyth, Brand Intelligence, Greece, 2026-09-01 to 2026-10-30, pp.2-14
  important: Digital conversation metrics are NOT representative population survey benchmarks and MUST NOT be calibrated as response percentages. No invented brand-specific
    priors.
  routing_rules:
  - Q01=1 etc refer to option code
  - If ask_if false store null with missing_reason=not_applicable
  - Multi selections cannot include exclusive options (e.g. Καμία, Δεν γνωρίζω) with substantive choices
  - If Q04=1 skip all brand-specific assessment questions
  - Q05=1 indicates recent buyer; never infer purchase experience otherwise
  - Q15=1 indicates problem; Q17=1 indicates contacted company
  - Maintain consistent persona and response history
