constraints:
- id: C1
  forbid: Q01 == '2' and Q05 == '1'
  reason: 'Κανόνας «Q05=1 indicates recent buyer»: αγορά από τον Κωτσόβολο στους 24 μήνες είναι αγορά ηλεκτρικής/ηλεκτρονικής συσκευής στους ίδιους 24 μήνες. Όποιος
    απάντησε Q01=«Όχι» δεν μπορεί να απαντήσει Q05=«Ναι».'
  origin: integration_overlay
- id: C2
  forbid: Q01 == '1' and Q05 == '1' and not (contains(Q02, '1') or contains(Q02, '2') or contains(Q02, '4') or contains(Q02, '6') or contains(Q02, '7'))
  reason: 'Ο Κωτσόβολος είναι μεγάλη αλυσίδα (φυσικά καταστήματα, e-shop) και πουλά και μέσω marketplace. Αγοραστής του στους 24 μήνες πρέπει να έχει δηλώσει στο
    Q02 «Μεγάλη αλυσίδα φυσικών καταστημάτων», «Ηλεκτρονικό κατάστημα μεγάλης αλυσίδας», «Αμιγώς ηλεκτρονικό κατάστημα / marketplace» (ή «Άλλο» / «Δεν θυμάμαι»).
    Απαγορεύεται μόνο όταν το Q02 περιέχει ΜΟΝΟ μικρό κατάστημα ή κατασκευαστή. (v2 μετά την πιλοτική: η v1 δεν επέτρεπε το marketplace.)'
  origin: integration_overlay
- id: C3
  forbid: Q06 == '1' and Q01 == '1' and not (contains(Q02, '1') or contains(Q02, '7'))
  reason: Πιο πρόσφατη αγορά Κωτσόβολου σε φυσικό κατάστημα ⇒ το Q02 περιέχει «Μεγάλη αλυσίδα φυσικών καταστημάτων» (ή «Δεν θυμάμαι»).
  origin: integration_overlay
- id: C4
  forbid: Q06 == '2' and Q01 == '1' and not (contains(Q02, '2') or contains(Q02, '4') or contains(Q02, '7'))
  reason: 'Πιο πρόσφατη αγορά Κωτσόβολου online ⇒ το Q02 περιέχει «Ηλεκτρονικό κατάστημα μεγάλης αλυσίδας» ή «Αμιγώς ηλεκτρονικό κατάστημα / marketplace» (ή «Δεν
    θυμάμαι»). v2: το Q06 δεν έχει επιλογή marketplace· αγορά από Κωτσόβολο μέσω marketplace καταγράφεται εύλογα ως «ηλεκτρονικό κατάστημα» (εύρημα QA· εκκρεμεί απόφαση
    συνεργάτη, βλ. Α14).'
  origin: integration_overlay
- id: C5
  forbid: Q04 == '1' and contains(Q23, '7')
  reason: Όποιος δεν γνωρίζει την αλυσίδα (Q04=1) δεν μπορεί να την εξετάζει ως εναλλακτική στο Q23.
  origin: integration_overlay
